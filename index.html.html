<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>数式お絵描きプロトタイプ</title>
<style>
  body { font-family: sans-serif; text-align: center; }
  canvas { border: 1px solid #ccc; margin-top: 20px; }
</style>
</head>
<body>

<h2>数式お絵描きプロトタイプ</h2>

<label>角度（度）: <input id="angle" type="number" value="30"></label><br><br>
<label>速度: <input id="speed" type="number" value="3"></label><br><br>
<label>最大線分数: <input id="maxLines" type="number" value="5000"></label><br><br>

<button onclick="startDrawing()">描画開始</button>

<canvas id="canvas" width="600" height="600"></canvas>

<script>
function startDrawing() {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const angleDeg = Number(document.getElementById("angle").value);
  const speed = Number(document.getElementById("speed").value);
  const maxLines = Number(document.getElementById("maxLines").value);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const R = 250; // 半径
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  // 円の描画
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = "#888";
  ctx.stroke();

  // スタート地点（円の右端）
  let x = cx + R;
  let y = cy;

  // 角度をラジアンに変換
  let angle = angleDeg * Math.PI / 180;

  let count = 0;

  function drawFrame() {
    if (count > maxLines) return;

    // 次の位置
    let nx = x + Math.cos(angle) * speed;
    let ny = y + Math.sin(angle) * speed;

    // 円の中心からの距離
    const dist = Math.sqrt((nx - cx)**2 + (ny - cy)**2);

    // 円の外に出る → 反射
    if (dist > R) {
      // 衝突点を求めるために少し戻す
      while (Math.sqrt((nx - cx)**2 + (ny - cy)**2) > R) {
        nx -= Math.cos(angle) * 0.1;
        ny -= Math.sin(angle) * 0.1;
      }

      // 法線ベクトル（円の中心→衝突点）
      const normalAngle = Math.atan2(ny - cy, nx - cx);

      // 反射角 = 入射角を法線で反転
      angle = 2 * normalAngle - angle + Math.PI;
    }

    // 線分を描画
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(nx, ny);
    ctx.strokeStyle = "black";
    ctx.stroke();

    // 座標更新
    x = nx;
    y = ny;

    count++;

    // スタート地点に戻ったら終了
    if (Math.abs(x - (cx + R)) < 1 && Math.abs(y - cy) < 1 && count > 10) {
      return;
    }

    requestAnimationFrame(drawFrame);
  }

  drawFrame();
}
</script>

</body>
</html>
